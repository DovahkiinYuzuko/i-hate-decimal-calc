<!DOCTYPE html>
<html lang="en" data-lang="{{LANG}}">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="{{META_DESCRIPTION}}">
  <title>{{TITLE}}</title>
  <style>/* {{KATEX_CSS}} */</style>
  <style>/* {{DADS_CSS}} */</style>
</head>
<body>
  <a class="skip-link" href="#mainContent">{{SKIP_LINK}}</a>

  <header class="site-header">
    <div class="header-brand">
      <button class="btn-hamburger" id="btnHamburger" aria-label="{{HAMBURGER_ARIA}}">
        <svg width="24" height="24" viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><path d="M3 18h18v-2H3v2zm0-5h18v-2H3v2zm0-7v2h18V6H3z"/></svg>
      </button>
      <a class="logo-title" href="#">ihd Reference</a>
      <span class="version-badge">v2.18.1</span>
    </div>
  </header>

  <!-- モバイル用スライドイン・ドロワー -->
  <div class="drawer-overlay" id="drawerOverlay"></div>
  <aside class="mobile-drawer" id="mobileDrawer" aria-label="{{DRAWER_TITLE}}">
    <div class="drawer-header">
      <span class="drawer-title">{{DRAWER_TITLE}}</span>
      <button id="btnCloseDrawer" class="btn-close-drawer" aria-label="{{DRAWER_CLOSE_ARIA}}">&times;</button>
    </div>
    {{TOC_HTML}}
  </aside>

  <div class="page-container">
    <nav class="sidebar-toc" id="sidebarToc" aria-label="{{TOC_ARIA}}">
      <h2 class="toc-title">{{TOC_TITLE}}</h2>
      {{TOC_HTML}}
    </nav>

    <main class="main-content" id="mainContent">
      <h1 class="dads-h1">{{TITLE}}</h1>
      {{LEAD_HTML}}

      <div class="search-wrapper">
        <div class="search-bar-inner">
          <svg class="search-icon" viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><path d="M15.5 14h-.79l-.28-.27C15.41 12.59 16 11.11 16 9.5 16 5.91 13.09 3 9.5 3S3 5.91 3 9.5 5.91 16 9.5 16c1.61 0 3.09-.59 4.23-1.57l.27.28v.79l5 4.99L20.49 19l-4.99-5zm-6 0C7.01 14 5 11.99 5 9.5S7.01 5 9.5 5 14 7.01 14 9.5 14z"/></svg>
          <input type="search" class="search-input" id="searchInput" placeholder="{{SEARCH_PLACEHOLDER}}" aria-label="{{SEARCH_ARIA}}">
        </div>
        <div class="search-status-bar" id="searchStatusBar">
          <span id="searchResultText"></span>
        </div>
      </div>

      <div class="section-toolbar">
        <button type="button" class="btn-action-sm" id="btnExpandAll">{{BTN_EXPAND_ALL}}</button>
        <button type="button" class="btn-action-sm" id="btnCollapseAll">{{BTN_COLLAPSE_ALL}}</button>
      </div>

      <div class="sections-container">
        {{SECTIONS_HTML}}
      </div>
    </main>
  </div>

  <script>/* {{VIEWER_JS}} */</script>
</body>
</html>
